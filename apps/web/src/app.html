<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Absolute, not %sveltekit.assets%: that resolves to a relative "./", which
         a trailing slash on /player/ would resolve against the wrong directory.
         The Room is always served from the root of its origin.

         The .ico comes first so browsers that cannot read an SVG icon — Safari
         before 16, and most crawlers — still find one; those that can read the
         SVG prefer it and stay sharp at any size. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Queue</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap">
    <!-- Wrapped rather than bare: an extension that injects into <body> can
         otherwise land inside the hydrated markup and break it. -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
